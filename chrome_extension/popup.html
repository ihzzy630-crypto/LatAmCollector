<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;width:330px;margin:0;padding:18px;color:#17212b;background:#f7f8fa}h1{font-size:17px;margin:0 0 14px}.brand{color:#ef553b}.box{background:white;border:1px solid #e3e7eb;border-radius:10px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:13px}.muted{color:#71808f;font-size:12px;line-height:1.6}.ok{color:#198754}.bad{color:#d83d27}.blue{color:#2b6cb0}button{width:100%;border:0;border-radius:8px;padding:10px;background:#ef553b;color:white;cursor:pointer;margin-top:8px}button.secondary{background:#e9edf1;color:#34404c}button:disabled{opacity:.5;cursor:not-allowed}input{width:92px;border:1px solid #d8dee5;border-radius:7px;padding:6px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:7px}.progress{height:7px;background:#edf0f3;border-radius:8px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;width:0;background:#ef553b;border-radius:8px;transition:width .2s}code{font-size:11px}
    #bulk-limit[hidden]{display:none}
  </style>
</head>
<body>
  <h1><span class="brand">LatAm</span> Chrome 采集助手 <small>v0.6.0</small></h1>
  <div class="box">
    <div class="row"><span>本地平台</span><b id="platform">检查中…</b></div>
    <div class="row"><span id="page-name">采集页面</span><b id="page">检查中…</b></div>
  </div>
  <div class="box">
    <b id="bulk-title">一键采集当前商品列表</b>
    <div class="row" id="bulk-limit"><span>本次最多采集</span><label><input id="bulk-max" type="number" value="3000" min="20" max="6000" step="20"> 件</label></div>
    <div class="progress"><i id="bulk-bar"></i></div>
    <div class="muted" id="bulk-state">先打开并刷新分类页或搜索结果页</div>
    <div class="actions" id="bulk-actions"><button id="bulk-start" disabled>开始全部采集</button><button id="bulk-stop" class="secondary" disabled>暂停</button></div>
    <div class="muted" id="bulk-help">Shopee 出现页面错误或验证时会暂停。手动打开正常商品列表后，可再开始采集。</div>
  </div>
  <div class="box">
    <div class="row"><span>捕获响应</span><b id="captures">0</b></div>
    <div class="row"><span>本地商品库</span><b id="products">0</b></div>
    <div class="row"><span>本地评论库</span><b id="reviews">0</b></div>
    <div class="muted" id="last">尚未捕获数据</div>
  </div>
  <div class="muted">保持本地平台运行，打开或刷新 Shopee / SHEIN 巴西站的分类页、搜索页、商品页或评论区。助手只整理页面公开响应，不读取密码。</div>
  <button id="queue" class="secondary">Shopee 子类和关键词批量采集</button>
  <button id="shopee-home" class="secondary">打开 Shopee 巴西首页</button>
  <button id="dashboard">打开选品雷达</button>
  <script src="popup.js"></script>
</body>
</html>
