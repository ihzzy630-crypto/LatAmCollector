<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LatAm Collector 采集助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <span class="popup-mark" aria-hidden="true">L</span>
    <div><p class="brand">LatAm Collector</p><h1>Chrome 采集助手</h1></div>
    <small>v0.9.0</small>
  </header>
  <section class="box" aria-label="连接状态">
    <div class="row"><span>本地平台</span><b id="platform">检查中…</b></div>
    <div class="row"><span id="page-name">采集页面</span><b id="page">检查中…</b></div>
  </section>
  <section class="box" aria-labelledby="bulk-title">
    <h2 id="bulk-title">一键采集当前商品列表</h2>
    <div class="row" id="bulk-limit"><label for="bulk-max">本次最多采集</label><span><input id="bulk-max" type="number" value="3000" min="20" max="6000" step="20"> 件</span></div>
    <div class="progress" aria-hidden="true"><i id="bulk-bar"></i></div>
    <p class="muted" id="bulk-state" role="status">先打开并刷新分类页或搜索结果页</p>
    <div class="actions bulk-actions" id="bulk-actions"><button id="bulk-start" disabled>开始全部采集</button><button id="bulk-stop" class="secondary" disabled>暂停</button></div>
    <p class="muted" id="bulk-help">遇到页面错误或验证会暂停。恢复正常商品列表后可继续。</p>
  </section>
  <section class="box" aria-label="入库记录">
    <div class="counts">
      <div><span>捕获响应</span><b id="captures">0</b></div>
      <div><span>本地商品</span><b id="products">0</b></div>
      <div><span>本地评论</span><b id="reviews">0</b></div>
    </div>
    <p class="muted" id="last">尚未捕获数据</p>
  </section>
  <footer class="popup-links">
    <button id="dashboard">打开选品雷达 <span aria-hidden="true">↗</span></button>
    <div class="actions">
      <button id="queue" class="secondary">批量采集队列</button>
      <button id="shopee-home" class="secondary">Shopee 巴西首页</button>
    </div>
  </footer>
  <script src="queue_core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
