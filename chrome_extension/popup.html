<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:"Microsoft YaHei",sans-serif;width:310px;margin:0;padding:18px;color:#17212b;background:#f7f8fa}h1{font-size:17px;margin:0 0 14px}.brand{color:#ef553b}.box{background:white;border:1px solid #e3e7eb;border-radius:10px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;margin:7px 0;font-size:13px}.muted{color:#71808f;font-size:12px;line-height:1.6}.ok{color:#198754}.bad{color:#d83d27}button{width:100%;border:0;border-radius:8px;padding:10px;background:#ef553b;color:white;cursor:pointer;margin-top:8px}code{font-size:11px}
  </style>
</head>
<body>
  <h1><span class="brand">LatAm</span> Chrome 采集助手 <small>v0.3</small></h1>
  <div class="box">
    <div class="row"><span>本地平台</span><b id="platform">检查中…</b></div>
    <div class="row"><span>Shopee 页面</span><b id="page">检查中…</b></div>
  </div>
  <div class="box">
    <div class="row"><span>捕获响应</span><b id="captures">0</b></div>
    <div class="row"><span>本地商品库</span><b id="products">0</b></div>
    <div class="row"><span>本地评论库</span><b id="reviews">0</b></div>
    <div class="muted" id="last">尚未捕获数据</div>
  </div>
  <div class="muted">保持本地平台运行，打开或刷新 Shopee 的分类页、商品页或评论区。销量控制、可信度和趋势在本地“选品雷达”中设置。助手不读取 Cookie 或密码。</div>
  <button id="dashboard">打开选品雷达</button>
  <script src="popup.js"></script>
</body>
</html>
