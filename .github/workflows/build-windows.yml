name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer to GitHub Releases
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Windows installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install_windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare offline translation models
        run: python -m windows.prepare_review_models build/review_models

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LatAmCollector --collect-binaries ctranslate2 --add-data "static;static" --add-data "chrome_extension;chrome_extension" launcher.py

      - name: Build Windows installer
        shell: powershell
        run: |
          $version = (Get-Content chrome_extension/manifest.json -Raw | ConvertFrom-Json).version
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not found on this runner.' }
          & $compiler "/DAppVersion=$version" windows/LatAmCollector.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installing and reinstalling
        shell: powershell
        run: |
          $setups = @(Get-ChildItem dist/LatAmCollector-Setup-*-x64.exe)
          if ($setups.Count -ne 1) { throw 'Expected one Windows installer.' }
          & .\windows\verify-install.ps1 -SetupFile $setups[0].FullName

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LatAmCollector-Windows-Setup
          path: dist/LatAmCollector-Setup-*-x64.exe
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: LatAmCollector-Windows
          path: dist/LatAmCollector.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LatAmCollector-Windows-Setup
          path: dist
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          setups=(dist/LatAmCollector-Setup-*-x64.exe)
          if [[ ${#setups[@]} -ne 1 ]]; then
            echo 'Expected one verified Windows installer.' >&2
            exit 1
          fi
          version=${setups[0]#dist/LatAmCollector-Setup-}
          version=${version%-x64.exe}
          helper="dist/LatAmCollector-Chrome-v$version.zip"
          zip -q -X -r "$helper" chrome_extension
          unzip -tq "$helper"
          gh release create "windows-v$version" "${setups[0]}" "$helper" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LatAmCollector Windows v$version" --notes-file windows/Windows-Guide.txt
